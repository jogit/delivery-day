name: Release

# Pushing a tag vX.Y.Z builds the signed release APK and publishes it on the Releases page.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

env:
  # Public fingerprint of the release signing certificate: an APK signed with any other key
  # (wrong or leaked secret) makes the release fail instead of being published.
  EXPECTED_CERT_SHA256: c2774a9c025ebb6b41318c9ed3e2b477fc5687d1ec8fe20adb5ab15138bf97c7

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >
          ./gradlew assembleRelease
          -Pdeliveryday.version="$VERSION"
          -Pdeliveryday.storeFile="$RUNNER_TEMP/release.jks"
          -Pdeliveryday.storePassword="$KEYSTORE_PASSWORD"
          -Pdeliveryday.keyAlias="$KEY_ALIAS"
          -Pdeliveryday.keyPassword="$KEY_PASSWORD"

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Check signature
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          APK=app/build/outputs/apk/release/app-release.apk
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
          echo "Signed with $ACTUAL"
          test "$ACTUAL" = "$EXPECTED_CERT_SHA256"
          mv "$APK" "DeliveryDay-$VERSION.apk"
          sha256sum "DeliveryDay-$VERSION.apk" > "DeliveryDay-$VERSION.apk.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          "DeliveryDay-$VERSION.apk" "DeliveryDay-$VERSION.apk.sha256"
          --title "Delivery Day $VERSION"
          --generate-notes
          --verify-tag
